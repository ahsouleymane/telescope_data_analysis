# Airflow standalone (SQLite + SequentialExecutor): one task at a time, which fits 8 GB of RAM (one Spark job at once).
# Needs the telescope:v2 image: run `make build` first.
services:
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: standalone
    user: "0:0"                     # needed to use /var/run/docker.sock; Airflow itself only schedules
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW_HOME: /opt/airflow
      _AIRFLOW_STANDALONE_USERNAME: admin
      # host paths, used by the DAG to mount the same folders in the task containers
      PROJECT_DIR: ${PROJECT_DIR:?use make airflow-up}
      RAW_DIR: ${RAW_DIR:-}              # empty = no raw data mounted (cleaned Parquet only)
      SPARK_TMP: ${SPARK_TMP:-./spark_tmp}
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    volumes:
      - ./bigdata_pipeline/airflow/dags:/opt/airflow/dags
      - airflow_home:/opt/airflow
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  airflow_home: